  <style>
    /* Kleine Hilfsstile */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* kein Scrollen */
      font-family: "Trebuchet MS", sans-serif;
    }

    @font-face {
      font-family: "pokemon-font-fire-red";
      src: url('./assets/pokemon_fire_red.ttf') format('truetype');
    }

    @font-face {
      font-family: "pokemon-gb";
      src: url('./assets/pokemon_gb.ttf') format('truetype');
    }

    .sprite-shadow { filter: drop-shadow(0 8px 12px rgba(0,0,0,0.45)); }
    .hp-bar-bg { background: rgba(255,255,255,0.06); }
    .hp-bar-fill { transition: width 500ms ease; height: 100%; border-radius: 999px; }

 
    .textbox {
      background: #f8f8f8;
      height: 100%;

      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;   
      align-items: stretch;
      box-sizing: border-box;
      font-family: 'pokemon-gb';
    }


    .textbox-text {
      overflow: hidden;       
      /* height: 100%; */
      display: flex;

      /* align-items: center; */
      border: 2vw solid transparent;
      border-image-source: url("./assets/choices_background.png");
      border-image-slice: 7;        /* wie weit vom Rand geschnitten wird */
      border-image-repeat: stretch;  /* oder repeat / round */
    }

    .textbox-text p {
      margin-left: 2vw;
      line-height: 1.5;
      font-size: 2vw;
    }

    .choices {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      /* gap: 6px; */
      align-content: top;
      font-family: 'pokemon-gb';

      border: 2vw solid transparent;
      border-image-source: url("./assets/choices_background.png");
      border-image-slice: 7;        /* wie weit vom Rand geschnitten wird */
      border-image-repeat: stretch;  /* oder repeat / round */
    }



    .choice {
      display: flex;
      position: relative;
      background: #f8f8f8;
      text-align: left;
      align-items: center;
      cursor: cursor;
      user-select: none;
      font-size: 2vw;
      font-family: 'pokemon-gb';
      height: 50%;
      
      border: none;
      outline: none;
      padding-left: 3vw;
    
    }

    .choice::before {
      line-height: 1;
      position: absolute;
      content: "-";
      left: 0px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }


    .choice:hover::before {
      opacity: 1;
    }

    .hp-container {
      width: 100%;
      height: 50%;
      background: #eaeaea;
      border: 0.3vw solid #3a3a3a;
      border-radius: 0.4px;
      padding: 0.3vw;
    }


    .hp-bar {
      height: 1vw;
      width: 100%;
      background: #4caf50;
      margin-bottom: 0.2vw;
      margin-top: 0.2vw;
      transition: width 0.4s linear, background-color 0.4s linear;
    }

    .hp-bar.medium { background: #ff9800; }
    .hp-bar.low { background: #f44336; }

    .xp-bar {
      height: 0.4vw;
      width: 0%;
      background: #2196f3;
      transition: width 0.4s linear
    }

    .hp-block {
      position: absolute;
      width: 20%;
      height: auto;
    }


    .hp-label {
      font-size: 1vw;
      font-weight: bold;
      font-family: 'pokemon-gb';
    }

    #battle {
      aspect-ratio: 16 / 9;

      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));

      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }

   #battle-scene {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

  @media (orientation: portrait) {
  #battle {
    width: min(100vw, calc(100vh * (16 / 9)));
    height: min(100vh, calc(100vw * (9 / 16)));
    }
  }

  @media (orientation: landscape) {
    #battle {
      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));
    }
  }

    #battle-screen {
      flex: 0 0 66.666%;
      min-height: 0;
    }

    #battle-screen canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated; /* optional */
    }


    #battle-textbox {
      flex: 0 0 33.333%;
      min-height: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    .scene {
      width: 100%;
      height: 100%;
    }

    <button onclick="activateXR()">Start Hello WebXR</button>
    <script>
    async function activateXR() {
      // Add a canvas element and initialize a WebGL context that is compatible with WebXR.
      console.log("Activating WebXR...");

      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const gl = canvas.getContext("webgl", {xrCompatible: true});

      // To be continued in upcoming steps.
      const scene = new THREE.Scene();

      // The cube will have a different color on each side.
      const materials = [
        new THREE.MeshBasicMaterial({color: 0xff0000}),
        new THREE.MeshBasicMaterial({color: 0x0000ff}),
        new THREE.MeshBasicMaterial({color: 0x00ff00}),
        new THREE.MeshBasicMaterial({color: 0xff00ff}),
        new THREE.MeshBasicMaterial({color: 0x00ffff}),
        new THREE.MeshBasicMaterial({color: 0xffff00})
      ];

      // Create the cube and add it to the demo scene.
      const cube = new THREE.Mesh(new THREE.BoxBufferGeometry(0.2, 0.2, 0.2), materials);
      cube.position.set(1, 1, 1);
      scene.add(cube);

      // Set up the WebGLRenderer, which handles rendering to the session's base layer.
      const renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;

      // The API directly updates the camera matrices.
      // Disable matrix auto updates so three.js doesn't attempt
      // to handle the matrices independently.
      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      // Initialize a WebXR session using "immersive-ar".
      const session = await navigator.xr.requestSession('inline');
      session.updateRenderState({
        baseLayer: new XRWebGLLayer(session, gl)
      });

      // A 'local' reference space has a native origin that is located
      // near the viewer's position at the time the session was created.
      const referenceSpace = await session.requestReferenceSpace('viewer');

      // Create a render loop that allows us to draw on the AR view.
      const onXRFrame = (time, frame) => {
        console.log("XR Frame", time, frame);
        // Queue up the next draw request.
        session.requestAnimationFrame(onXRFrame);

        // Bind the graphics framebuffer to the baseLayer's framebuffer
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer)

        // Retrieve the pose of the device.
        // XRFrame.getViewerPose can return null while the session attempts to establish tracking.
        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
          // In mobile AR, we only have one view.
          const view = pose.views[0];

          const viewport = session.renderState.baseLayer.getViewport(view);
          renderer.setSize(viewport.width, viewport.height)

          // Use the view's transform matrix and projection matrix to configure the THREE.camera.
          camera.matrix.fromArray(view.transform.matrix)
          camera.projectionMatrix.fromArray(view.projectionMatrix);
          camera.updateMatrixWorld(true);

          // Render the scene with THREE.WebGLRenderer.
          renderer.render(scene, camera)
        }
      }
      session.requestAnimationFrame(onXRFrame);
    }
    </script>
